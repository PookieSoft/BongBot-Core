name: PR CI & Test

# Thin caller for PookieSoft/workflows pr-ci. Library-only repo: no Docker.

on:
    pull_request:
        types: [opened, synchronize, labeled]
        branches: [main]

permissions:
    checks: write
    pull-requests: write
    packages: read

jobs:
    ci:
        uses: PookieSoft/workflows/.github/workflows/pr-ci.yml@v1
        with:
            runtime: node
            build-docker: false
            smoke-test: false
            ssh-deploy: false
            coverage-comment: true
            environment: Dev
        secrets: inherit
