# .github/workflows/deploy-develop.yml

name: PR CI & Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]

jobs:
  build-and-test:
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --- NEW STEP TO VALIDATE LABELS ---
      - name: Check for Version Label
        if: "! (contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch'))"
        run: |
          echo "❌ Error: Pull Request must have a 'major', 'minor', or 'patch' label."
          exit 1

      - name: Find Previous Comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: ''

      - name: Delete Previous Comment
        if: steps.find-comment.outputs.comment-id != ''
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.find-comment.outputs.comment-id }}
            })

      # --- Run tests with coverage ---
      - name: Run Unit Tests with Coverage
        run: |
          npm ci
          npm run test

      # --- Debug coverage files ---
      - name: Debug Coverage Files
        run: |
          echo "Checking for coverage files..."
          ls -la coverage/ || echo "Coverage directory not found"
          if [ -f coverage/coverage-summary.json ]; then
            echo "✅ coverage-summary.json found"
            cat coverage/coverage-summary.json
          else
            echo "❌ coverage-summary.json not found"
          fi
          if [ -f coverage/lcov.info ]; then
            echo "✅ lcov.info found"
            echo "File size: $(wc -c < coverage/lcov.info) bytes"
            echo "First 10 lines:"
            head -10 coverage/lcov.info
          else
            echo "❌ lcov.info not found"
          fi

      # --- Generate coverage report manually ---
      - name: Generate Coverage Report
        id: coverage
        run: |
          # Install bc for numerical comparisons
          sudo apt-get update && sudo apt-get install -y bc
          
          if [ -f coverage/coverage-summary.json ]; then
            echo "Generating detailed coverage report from coverage-summary.json..."
            
            # Debug: Show all keys in the coverage file
            echo "Available keys in coverage-summary.json:"
            jq -r 'keys[]' coverage/coverage-summary.json
            
            # Function to get coverage emoji and color
            get_coverage_indicator() {
              local percentage=$1
              if (( $(echo "$percentage >= 90" | bc -l) )); then
                echo "🟢 **$percentage%**"
              elif (( $(echo "$percentage >= 80" | bc -l) )); then
                echo "🟡 **$percentage%**"
              elif (( $(echo "$percentage >= 60" | bc -l) )); then
                echo "🟠 **$percentage%**"
              else
                echo "🔴 **$percentage%**"
              fi
            }
            
            # Parse total coverage data
            TOTAL_LINES=$(jq -r '.total.lines.pct // "0"' coverage/coverage-summary.json)
            TOTAL_STATEMENTS=$(jq -r '.total.statements.pct // "0"' coverage/coverage-summary.json)
            TOTAL_FUNCTIONS=$(jq -r '.total.functions.pct // "0"' coverage/coverage-summary.json)
            TOTAL_BRANCHES=$(jq -r '.total.branches.pct // "0"' coverage/coverage-summary.json)
            
            # Get indicators for totals
            TOTAL_STMT_IND=$(get_coverage_indicator "$TOTAL_STATEMENTS")
            TOTAL_BRANCH_IND=$(get_coverage_indicator "$TOTAL_BRANCHES")
            TOTAL_FUNC_IND=$(get_coverage_indicator "$TOTAL_FUNCTIONS")
            TOTAL_LINE_IND=$(get_coverage_indicator "$TOTAL_LINES")
            
            # Start building the coverage report
            COVERAGE_REPORT="## 📊 Test Coverage Report

            ### 📈 Coverage Table

            | File | Statements | Branches | Functions | Lines | Issues |
            |------|------------|----------|-----------|-------|--------|
            | **🌍 All files** | $TOTAL_STMT_IND | $TOTAL_BRANCH_IND | $TOTAL_FUNC_IND | $TOTAL_LINE_IND | |"
            
            # Process files by directory
            declare -A dir_files
            
            # Collect all source files - try different path patterns
            echo "Processing individual files..."
            for file_path in $(jq -r 'keys[]' coverage/coverage-summary.json | grep -v "^total$"); do
              echo "Found file: $file_path"
              
              # Clean up the path - handle both absolute and relative paths
              if [[ "$file_path" == /* ]]; then
                # Absolute path - extract relative path
                rel_path=$(echo "$file_path" | sed 's|^.*/BongBot/||' | sed 's|^/home/[^/]*/[^/]*/||')
              else
                # Already relative
                rel_path="$file_path"
              fi
              
              # Skip node_modules and coverage directories
              if [[ "$rel_path" == *"node_modules"* ]] || [[ "$rel_path" == *"coverage/"* ]]; then
                continue
              fi
              
              dir_name=$(dirname "$rel_path")
              file_name=$(basename "$rel_path")
              
              # Get coverage stats
              statements=$(jq -r ".[\"$file_path\"].statements.pct // 0" coverage/coverage-summary.json)
              branches=$(jq -r ".[\"$file_path\"].branches.pct // 0" coverage/coverage-summary.json)
              functions=$(jq -r ".[\"$file_path\"].functions.pct // 0" coverage/coverage-summary.json)
              lines=$(jq -r ".[\"$file_path\"].lines.pct // 0" coverage/coverage-summary.json)
              
              echo "  Stats: S:$statements B:$branches F:$functions L:$lines"
              
              # Get indicators
              stmt_ind=$(get_coverage_indicator "$statements")
              branch_ind=$(get_coverage_indicator "$branches")
              func_ind=$(get_coverage_indicator "$functions")
              line_ind=$(get_coverage_indicator "$lines")
              
              # Identify issues
              issues=""
              if (( $(echo "$statements < 80" | bc -l) )); then
                issues="$issues Statements"
              fi
              if (( $(echo "$branches < 80" | bc -l) )); then
                issues="$issues Branches"
              fi
              if (( $(echo "$functions < 80" | bc -l) )); then
                issues="$issues Functions"
              fi
              if (( $(echo "$lines < 80" | bc -l) )); then
                issues="$issues Lines"
              fi
              
              if [ -n "$issues" ]; then
                issues="⚠️ Low:$issues"
              else
                issues="✅ Good"
              fi
              
              # Store file data
              file_row="| \`$file_name\` | $stmt_ind | $branch_ind | $func_ind | $line_ind | $issues |"
              
              if [[ ! "${dir_files[$dir_name]}" ]]; then
                dir_files["$dir_name"]=""
              fi
              dir_files["$dir_name"]="${dir_files[$dir_name]}$file_row\n"
            done
            
            echo "Found ${#dir_files[@]} directories with files"
            
            # Add directory sections to report
            for dir in $(printf '%s\n' "${!dir_files[@]}" | sort); do
              if [ "$dir" != "." ]; then
                # Add directory header
                COVERAGE_REPORT="$COVERAGE_REPORT
            | **📁 $dir** | | | | | |"
              fi
              
              # Add files in this directory
              COVERAGE_REPORT="$COVERAGE_REPORT
            $(echo -e "${dir_files[$dir]}" | sed '/^$/d')"
            done
            
            # Add legend and summary
            COVERAGE_REPORT="$COVERAGE_REPORT

            ### 📋 Legend
            - 🟢 **Excellent** (≥90%) - Great coverage!
            - 🟡 **Good** (≥80%) - Acceptable coverage
            - 🟠 **Fair** (≥60%) - Needs improvement
            - 🔴 **Poor** (<60%) - Requires attention

            ### 📊 Overall Summary
            - **Total Statements:** $TOTAL_STATEMENTS% 
            - **Total Branches:** $TOTAL_BRANCHES%
            - **Total Functions:** $TOTAL_FUNCTIONS%
            - **Total Lines:** $TOTAL_LINES%"
            
            # Output the report using proper multiline format
            {
              echo "report<<EOF"
              echo "$COVERAGE_REPORT"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            
          else
            echo "report=❌ Coverage files not found" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pookiesoft'

      - name: Build and Publish Dev Package
        id: dev_publish
        run: |
          npm run build
          DEV_VERSION="${{ steps.version.outputs.version }}-beta.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          npm version "$DEV_VERSION" --no-git-tag-version
          npm publish --tag "dev-pr${{ github.event.pull_request.number }}"
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "tag=dev-pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Steps for regular user PRs ---
      - name: Create New Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **BongBot Core Validated** 🚀

            - **Dev Package:** `npm install @pookiesoft/bongbot-core@${{ steps.dev_publish.outputs.tag }}`
            - **Version:** `${{ steps.dev_publish.outputs.version }}`

            <details>
            <summary>Coverage Report (click to expand)</summary>

            ${{ steps.coverage.outputs.report || '❌ Coverage report not available' }}

            </details>