name: Create Release and Publish

# Thin caller for PookieSoft/workflows release. Library-only: publishes to
# GitHub Packages, no Docker.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: read
    packages: write

jobs:
    release:
        uses: PookieSoft/workflows/.github/workflows/release.yml@v1
        with:
            runtime: node
            build-docker: false
            publish-package: true
            codecov-slug: PookieSoft/BongBot-Core
            environment: Prod
        secrets: inherit
