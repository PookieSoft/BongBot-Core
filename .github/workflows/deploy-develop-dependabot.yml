name: PR CI & Test (Dependabot)

# Thin caller for PookieSoft/workflows dependabot-pr-ci. Library-only repo:
# label cleanup + tests, no Docker.

on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    packages: read

jobs:
    ci:
        uses: PookieSoft/workflows/.github/workflows/dependabot-pr-ci.yml@v1
        with:
            runtime: node
            sync-bun-lock: false
            build-docker: false
            smoke-test: false
            environment: Dev
        secrets: inherit
